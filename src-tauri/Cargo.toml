[package]
name = "quotatide-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[lib]
name = "quotatide_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "quotatide"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
base64 = "=0.22.1"
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
futures-util = "=0.3.33"
keyring = "=4.1.5"
lettre = { version = "=0.11.22", default-features = false, features = [
  "builder",
  "pool",
  "smtp-transport",
  "tokio1-rustls-tls",
] }
quotatide-core = { path = "../crates/quotatide-core", version = "=0.1.0" }
quotatide-native-notifications = { path = "../crates/quotatide-native-notifications", version = "=0.1.0" }
reqwest = { version = "=0.13.4", default-features = false, features = [
  "json",
  "native-tls",
  "stream",
  "system-proxy",
] }
rfd = { version = "=0.17.2", default-features = false, features = ["xdg-portal"] }
rusqlite = { version = "=0.37.0", features = ["bundled"] }
secrecy = "=0.10.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"
tauri = { version = "=2.11.5", features = ["image-png", "macos-private-api", "tray-icon"] }
tauri-plugin-autostart = "=2.5.1"
tauri-plugin-single-instance = "=2.4.3"
tauri-plugin-updater = "=2.10.1"
tempfile = "=3.25.0"
thiserror = "=2.0.19"
tokio = { version = "=1.49.0", features = ["sync", "time"] }
zip = { version = "=8.1.0", default-features = false }

[target.'cfg(unix)'.dependencies]
nix = { version = "=0.31.3", default-features = false, features = ["fs", "user"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
  "Win32_Graphics_Dwm",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tokio = { version = "=1.49.0", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
