[package]
name = "quotatide-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
chrono-tz = "=0.10.4"
email_address = { version = "=0.2.9", default-features = false }
iana-time-zone = "=0.1.65"
secrecy = "=0.10.3"
rusqlite = { version = "=0.37.0", features = ["backup", "bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.149"
getrandom = "=0.4.3"
sha2 = "=0.10.9"
thiserror = "=2.0.19"
tokio = { version = "=1.49.0", features = ["macros", "sync", "time"] }
tokio-util = { version = "=0.7.18", features = ["rt"] }
tokio-rusqlite = { version = "=0.7.0", features = ["bundled"] }
ts-rs = { version = "=12.0.1", features = ["serde-compat"] }
uuid = { version = "=1.24.0", features = ["v7"] }

[dev-dependencies]
proptest = "=1.9.0"
serde_json = "=1.0.149"
tempfile = "=3.25.0"
tokio = { version = "=1.49.0", features = ["macros", "rt-multi-thread", "test-util"] }

[lints]
workspace = true
