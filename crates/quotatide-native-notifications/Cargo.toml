[package]
name = "quotatide-native-notifications"
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
authors = ["TheBlind"]
license = "MIT"
publish = false

[dependencies]
sha2 = "=0.10.9"
thiserror = "=2.0.19"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "=0.6.2"
objc2 = "=0.6.4"
objc2-foundation = { version = "=0.3.2", features = ["NSError", "NSObject", "NSString"] }
objc2-user-notifications = { version = "=0.3.2", default-features = false, features = [
  "block2",
  "UNNotification",
  "UNNotificationContent",
  "UNNotificationRequest",
  "UNNotificationResponse",
  "UNNotificationSettings",
  "UNNotificationSound",
  "UNNotificationTrigger",
  "UNUserNotificationCenter",
] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "=0.61.3", features = [
  "Data_Xml_Dom",
  "Foundation",
  "UI_Notifications",
] }

# This crate cannot inherit the workspace's `unsafe_code = "forbid"` because
# objc2 requires audited unsafe declarations. Keep every other workspace lint
# strict and allow unsafe only at the annotated macOS FFI boundaries.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
