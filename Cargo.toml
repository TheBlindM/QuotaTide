[workspace]
members = ["crates/quotatide-core", "src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["TheBlind"]
license = "MIT"
repository = "__GITHUB_REPOSITORY__"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
