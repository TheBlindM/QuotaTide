[workspace]
members = [
  "crates/quotatide-core",
  "crates/quotatide-native-notifications",
  "crates/quotatide-release-tools",
  "src-tauri",
]
resolver = "2"

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
authors = ["TheBlind"]
license = "MIT"
repository = "https://github.com/TheBlindM/QuotaTide"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
