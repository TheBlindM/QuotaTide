      C474 614 528 622 578 573
      C626 526 665 501 700 522
      C731 540 745 574 778 582
      L778 774 L246 774 Z" fill="url(#tide)"/>
    <path d="M246 602
      C312 552 365 548 421 582
      C474 614 528 622 578 573
      C626 526 665 501 700 522"
