  <g stroke="#b9f8ff" stroke-linecap="round" stroke-width="15">
    <path d="M512 275v34"/>
    <path d="M407 294l14 32"/>
    <path d="M320 360l27 22"/>
    <path d="M279 459l34 7"/>
    <path d="M617 294l-14 32"/>
    <path d="M704 360l-27 22"/>
    <path d="M745 459l-34 7"/>
  </g>

  <g clip-path="url(#dialClip)">
    <path d="M246 602
