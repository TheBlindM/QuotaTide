<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img"
  aria-labelledby="title description">
  <title id="title">QuotaTide application icon</title>
  <desc id="description">A circular quota gauge containing a rising tide.</desc>
  <defs>
    <linearGradient id="tile" x1="170" y1="130" x2="850" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#17325c"/>
      <stop offset="0.52" stop-color="#08182f"/>
      <stop offset="1" stop-color="#030a18"/>
    </linearGradient>
    <linearGradient id="rim" x1="290" y1="240" x2="760" y2="770" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#74f5ff"/>
      <stop offset="0.45" stop-color="#29c7ff"/>
      <stop offset="1" stop-color="#2670ff"/>
    </linearGradient>
    <linearGradient id="tide" x1="340" y1="470" x2="680" y2="770" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#56efff"/>
      <stop offset="0.44" stop-color="#15b8f2"/>
      <stop offset="1" stop-color="#1762e6"/>
    </linearGradient>
    <linearGradient id="glass" x1="260" y1="175" x2="650" y2="710" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.32" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="43%" r="52%">
      <stop offset="0" stop-color="#16d9ff" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#16d9ff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="dialClip">
      <circle cx="512" cy="500" r="232"/>
    </clipPath>
  </defs>

  <rect x="76" y="76" width="872" height="872" rx="220" fill="#020713" opacity="0.72"/>
  <rect x="88" y="72" width="848" height="848" rx="210" fill="url(#tile)"/>
  <rect x="102" y="86" width="820" height="820" rx="196" fill="none"
