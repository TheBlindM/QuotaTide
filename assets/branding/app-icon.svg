  <ellipse cx="512" cy="456" rx="356" ry="350" fill="url(#halo)"/>

  <circle cx="512" cy="500" r="268" fill="#051225" stroke="#020712" stroke-width="18"/>
  <circle cx="512" cy="500" r="252" fill="none" stroke="url(#rim)" stroke-width="44"/>
  <circle cx="512" cy="500" r="226" fill="none" stroke="#d8fbff"
