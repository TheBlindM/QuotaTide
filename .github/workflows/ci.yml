name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-and-ui:
    name: Core and UI
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy, rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install UI dependencies
        run: npm --prefix ui ci
      - name: Install pinned browser test runtime
        working-directory: ui
        run: npx playwright install --with-deps chromium
      - name: Check Rust formatting
        run: cargo fmt --all --check
      - name: Lint quota core
        run: cargo clippy -p quotatide-core --all-targets --all-features -- -D warnings
      - name: Test quota core
        run: cargo test -p quotatide-core
      - name: Check UI
        run: npm --prefix ui run check
      - name: Check release tooling and UI size budget
        run: |
          npm test
          node scripts/qa/check-ui-budget.mjs ui/dist
      - name: Check desktop version consistency
        run: node scripts/check-desktop-versions.mjs
      - name: Check desktop product identity
        run: node scripts/check-desktop-identity.mjs
      - name: Check updater public key and fingerprint
        run: node scripts/check-updater-key.mjs
      - name: Verify generated TypeScript bindings
        run: git diff --exit-code -- ui/src/bindings
      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.20.2 --locked
      - name: Check licenses and dependency policy
        run: cargo deny check

  macos-bundle:
    name: macOS universal bundle
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
          components: clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install UI dependencies
        run: npm --prefix ui ci
      - name: Test desktop workspace
        run: cargo test --workspace
      - name: Lint desktop workspace
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version 2.11.4 --locked
      - name: Build universal application bundle
        run: cargo tauri build --target universal-apple-darwin --bundles app

  windows-bundle:
    name: Windows x64 bundle
    # Keep an explicit, supported Windows compatibility baseline for v0.1.x.
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install UI dependencies
        run: npm --prefix ui ci
      # The complete GUI library unit suite runs on macOS. On headless Windows,
      # compile every test target, execute the platform-safe integration tests,
      # then smoke-test the real release executable after bundling.
      - name: Test desktop workspace
        run: |
          cargo test --workspace --exclude quotatide-desktop
          cargo test -p quotatide-desktop --no-run
          cargo test -p quotatide-desktop --test auth_file --test background_lifecycle --test live_account_manual --test reset_radar_contract --test window_configuration
      - name: Lint desktop workspace
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version 2.11.4 --locked
      - name: Build NSIS application bundle
        run: cargo tauri build --bundles nsis
      - name: Smoke-test the release executable
        shell: pwsh
        run: |
          $app = Start-Process target\release\quotatide.exe -PassThru
          Start-Sleep -Seconds 5
          if ($app.HasExited) {
            throw "QuotaTide exited during startup with code $($app.ExitCode)"
          }
          Stop-Process -Id $app.Id
