name: Publish validated release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing immutable draft tag (for example v0.1.0)"
        required: true
        type: string

permissions: {}

concurrency:
  group: publish-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Verify evidence package and publish draft
    runs-on: ubuntu-latest
    environment: public-release
    permissions:
      contents: write
    steps:
      - name: Checkout exact release tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.13.1
      - name: Verify immutable release identity
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          node scripts/release/check-version.mjs "$RELEASE_TAG"
          node scripts/check-release-identity.mjs
          test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$(git rev-parse HEAD)"
      - name: Download draft and evidence package
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          mkdir release-download evidence-package
          gh release download "$RELEASE_TAG" --dir release-download
          version="$RELEASE_TAG"
          version="${version#v}"
          scripts/qa/extract-evidence-package.sh \
            "release-download/release-evidence-${version}.tar.gz" \
            evidence-package
      - name: Enforce final-candidate release evidence
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          version="$RELEASE_TAG"
          version="${version#v}"
          node scripts/release/verify-assets.mjs \
            release-download "$version" --evidence-package
          node scripts/qa/check-evidence.mjs \
            evidence-package/release-evidence.json \
            release-download \
            evidence-package
      - name: Publish only after the gate passes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release edit "$RELEASE_TAG" --draft=false --latest
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = false
